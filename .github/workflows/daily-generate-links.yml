name: 每日自动生成 Clash 节点链接（带补零控制）

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 获取日期
        id: date
        run: |
          echo "year=$(date +%Y)" >> $GITHUB_OUTPUT
          echo "month_zero=$(date +%m)" >> $GITHUB_OUTPUT    # 05
          echo "month_nozero=$(date +%-m)" >> $GITHUB_OUTPUT # 5
          echo "day_zero=$(date +%d)" >> $GITHUB_OUTPUT      # 21
          echo "day_nozero=$(date +%-d)" >> $GITHUB_OUTPUT   # 21
          echo "full=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 生成带补零控制的链接
        run: |
          > many-daily-clash-nodes-latest
          while IFS=' ' read -r base month_pad day_pad || [ -n "$base" ]; do
            if [[ -z "$base" || "$base" == \#* ]]; then
              continue
            fi

            # 选择月份
            if [ "$month_pad" = "1" ]; then
              m=${{ steps.date.outputs.month_zero }}
            else
              m=${{ steps.date.outputs.month_nozero }}
            fi

            # 选择日期
            if [ "$day_pad" = "1" ]; then
              d=${{ steps.date.outputs.day_zero }}
            else
              d=${{ steps.date.outputs.day_nozero }}
            fi

            # 拼接链接
            echo "${base}/${{ steps.date.outputs.year }}/${m}/${{ steps.date.outputs.full }}.yaml" >> many-daily-clash-nodes-latest
          done < daily-source.list

      - name: 提交更新
        uses: EndBug/add-and-commit@v9
        with:
          message: '🤖 自动更新每日节点（带补零控制）'
          add: 'many-daily-clash-nodes-latest'
