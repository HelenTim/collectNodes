name: 每日自动生成 Clash 节点链接（完整版）

on:
  schedule:
    - cron: '0 8 * * *'  # 每天早8点
  workflow_dispatch:     # 允许手动测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取日期变量
        id: date
        run: |
          echo "year=$(date +%Y)" >> $GITHUB_OUTPUT
          echo "month0=$(date +%m)" >> $GITHUB_OUTPUT   # 05
          echo "month=$(date +%-m)" >> $GITHUB_OUTPUT  # 5
          echo "day0=$(date +%d)" >> $GITHUB_OUTPUT    # 21
          echo "day=$(date +%-d)" >> $GITHUB_OUTPUT    # 21
          echo "date8=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 读取配置并生成链接
        run: |
          # 清空输出文件
          > many-daily-clash-nodes-latest

          # 逐行读取：链接 月补零 日补零 后缀
          while read -r base pad_m pad_d suffix || [ -n "$base" ]; do
            # 跳过空行、注释行
            [[ -z "$base" || "$base" == \#* ]] && continue

            # 选择月份
            if [ "$pad_m" = "1" ]; then m=${{ steps.date.outputs.month0 }}; else m=${{ steps.date.outputs.month }}; fi
            # 选择日期
            if [ "$pad_d" = "1" ]; then d=${{ steps.date.outputs.day0 }}; else d=${{ steps.date.outputs.day }}; fi

            # 拼接最终链接
            echo "${base}/${{ steps.date.outputs.year }}/${m}/${{ steps.date.outputs.date8 }}${suffix}" >> many-daily-clash-nodes-latest
          done < daily-source.list

      - name: 提交更新到仓库
        uses: EndBug/add-and-commit@v9
        with:
          message: "🤖 自动更新每日节点链接"
          add: "many-daily-clash-nodes-latest"
